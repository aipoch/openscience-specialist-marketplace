name: Publish Specialist

on:
  workflow_dispatch:
    inputs:
      specialist_id:
        description: Stable Specialist ID
        required: true
        type: string
      version:
        description: Immutable SemVer version
        required: true
        type: string
      source_commit_or_tag:
        description: Full upstream commit SHA (resolve tags before dispatch)
        required: true
        type: string

concurrency:
  group: openscience-specialist-marketplace-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate authoring input
        run: |
          npm run format:check
          npm test
          npm run validate

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
    env:
      SPECIALIST_ID: ${{ inputs.specialist_id }}
      VERSION: ${{ inputs.version }}
      SOURCE_COMMIT_OR_TAG: ${{ inputs.source_commit_or_tag }}
      MARKETPLACE_CDN_PREFIX: /open-science/specialist-marketplace/v1/
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the current main commit
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Publication must be dispatched from main"
            exit 1
          }
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || {
            echo "::error::Publication commit is not the current main commit"
            exit 1
          }

      - name: Require protected publication configuration
        shell: bash
        env:
          MARKETPLACE_SIGNING_KEY_ID: ${{ vars.MARKETPLACE_SIGNING_KEY_ID }}
          MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64 }}
          MARKETPLACE_EXPECTED_KEY_FINGERPRINT: ${{ vars.MARKETPLACE_EXPECTED_KEY_FINGERPRINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MARKETPLACE_BUCKET: ${{ secrets.MARKETPLACE_BUCKET }}
          MARKETPLACE_CDN_DISTRIBUTION_ID: ${{ secrets.MARKETPLACE_CDN_DISTRIBUTION_ID }}
          MARKETPLACE_CDN_BASE_URL: ${{ secrets.MARKETPLACE_CDN_BASE_URL }}
        run: |
          required=(
            MARKETPLACE_SIGNING_KEY_ID
            MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64
            MARKETPLACE_EXPECTED_KEY_FINGERPRINT
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            MARKETPLACE_BUCKET
            MARKETPLACE_CDN_DISTRIBUTION_ID
            MARKETPLACE_CDN_BASE_URL
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing protected publication configuration: ${name}"
              missing=1
            fi
          done
          [[ "$MARKETPLACE_CDN_BASE_URL" =~ ^https://[^/]+/?$ ]] || {
            echo "::error::MARKETPLACE_CDN_BASE_URL must be an HTTPS origin without a path"
            missing=1
          }
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Build deterministic release
        run: |
          npm run build:release -- \
            --specialist-id "$SPECIALIST_ID" \
            --version "$VERSION" \
            --output dist
          configured_commit="$(node -p "JSON.parse(require('fs').readFileSync('specialists/${SPECIALIST_ID}/versions/${VERSION}/release.config.json')).source.commit")"
          [[ "$SOURCE_COMMIT_OR_TAG" == "$configured_commit" ]] || {
            echo "::error::source_commit_or_tag must equal the release config's full source commit"
            exit 1
          }

      - name: Prepare candidate Marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64 }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/published >/dev/null; then
            git fetch origin published:refs/remotes/origin/published
          elif [[ "$?" -ne 2 ]]; then
            echo "::error::Unable to determine whether the published branch exists"
            exit 1
          fi
          if git show-ref --verify --quiet refs/remotes/origin/published; then
            git show origin/published:marketplace.json > dist/base-marketplace.json
            git show origin/published:marketplace.json.sig > dist/base-marketplace.json.sig
            git archive origin/published releases | tar -x -C dist
            node scripts/list-release-artifacts.mjs \
              --marketplace dist/base-marketplace.json \
              --root dist > dist/base-artifacts.json
            while IFS=$'\t' read -r tag asset artifact_path; do
              mkdir -p "dist/$(dirname "$artifact_path")"
              gh release download "$tag" \
                --pattern "$asset" \
                --dir "dist/$(dirname "$artifact_path")"
            done < <(jq -r '.[] | [.tag, .asset_name, .path] | @tsv' dist/base-artifacts.json)
            npm run verify:marketplace -- \
              --marketplace dist/base-marketplace.json \
              --signature dist/base-marketplace.json.sig \
              --root dist
          else
            cp protocol/fixtures/valid/empty-marketplace.json dist/base-marketplace.json
          fi
          release_path="dist/releases/${SPECIALIST_ID}/${VERSION}.json"
          node scripts/update-marketplace.mjs \
            --base dist/base-marketplace.json \
            --entry dist/marketplace-entry.json \
            --release "$release_path" \
            --output dist/marketplace.json

      - name: Sign candidate Marketplace
        env:
          MARKETPLACE_SIGNING_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.MARKETPLACE_SIGNING_PRIVATE_KEY_PKCS8_BASE64 }}
          MARKETPLACE_SIGNING_KEY_ID: ${{ vars.MARKETPLACE_SIGNING_KEY_ID }}
          MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64 }}
          MARKETPLACE_EXPECTED_KEY_FINGERPRINT: ${{ vars.MARKETPLACE_EXPECTED_KEY_FINGERPRINT }}
        run: |
          node scripts/sign-marketplace.mjs \
            --marketplace dist/marketplace.json \
            --output dist/marketplace.json.sig

      - name: Verify candidate Marketplace
        env:
          MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MARKETPLACE_EXPECTED_PUBLIC_KEY_SPKI_BASE64 }}
        run: |
          npm run verify:marketplace -- \
            --marketplace dist/marketplace.json \
            --signature dist/marketplace.json.sig \
            --root dist

      - name: Reconcile immutable GitHub state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${SPECIALIST_ID}-v${VERSION}"
          asset="${SPECIALIST_ID}-${VERSION}.zip"
          expected_asset="dist/specialists/${SPECIALIST_ID}/${VERSION}/${asset}"
          mkdir -p dist/existing-release
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > dist/existing-release/release.json \
            2> dist/existing-release/error.log; then
            target="$(jq -r '.target_commitish' dist/existing-release/release.json)"
            draft="$(jq -r '.draft' dist/existing-release/release.json)"
            prerelease="$(jq -r '.prerelease' dist/existing-release/release.json)"
            if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]] || \
               ! git merge-base --is-ancestor "$target" "$GITHUB_SHA"; then
              echo "::error::Existing GitHub Release target is not an ancestor of the current main commit"
              exit 1
            fi
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            [[ "$(git rev-list -n 1 "$tag")" == "$target" ]] || {
              echo "::error::Existing GitHub Release tag does not match its immutable target"
              exit 1
            }
            [[ "$draft" == false && "$prerelease" == false ]] || {
              echo "::error::Existing GitHub Release must be public and non-prerelease"
              exit 1
            }
            gh release download "$tag" --pattern "$asset" --dir dist/existing-release
            cmp "$expected_asset" "dist/existing-release/${asset}" || {
              echo "::error::Existing GitHub Release asset bytes do not match"
              exit 1
            }
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
          elif grep -q "HTTP 404" dist/existing-release/error.log; then
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
          else
            cat dist/existing-release/error.log >&2
            exit 1
          fi

          if git show-ref --verify --quiet refs/remotes/origin/published && \
             git cat-file -e "origin/published:releases/${SPECIALIST_ID}/${VERSION}.json" 2>/dev/null; then
            git show "origin/published:releases/${SPECIALIST_ID}/${VERSION}.json" \
              > dist/existing-release/descriptor.json
            cmp "dist/releases/${SPECIALIST_ID}/${VERSION}.json" \
              dist/existing-release/descriptor.json || {
              echo "::error::Existing published release descriptor bytes do not match"
              exit 1
            }
          fi

      - name: Stage and verify exact CDN bytes
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MARKETPLACE_BUCKET: ${{ secrets.MARKETPLACE_BUCKET }}
        run: |
          set -euo pipefail
          prefix="${MARKETPLACE_CDN_PREFIX#/}"
          prefix="${prefix%/}"
          stage="${prefix}/staging/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          descriptor="releases/${SPECIALIST_ID}/${VERSION}.json"
          artifact="specialists/${SPECIALIST_ID}/${VERSION}/${SPECIALIST_ID}-${VERSION}.zip"

          reconcile_object() {
            local object="$1" expected="$2" state_name="$3" existing="$4"
            if aws s3api head-object --bucket "$MARKETPLACE_BUCKET" \
              --key "${prefix}/${object}" >/dev/null 2>dist/cdn-head-error.log; then
              aws s3 cp "s3://${MARKETPLACE_BUCKET}/${prefix}/${object}" "$existing" --only-show-errors
              cmp "$expected" "$existing" || {
                echo "::error::Existing CDN object bytes do not match: ${object}"
                exit 1
              }
              echo "${state_name}=true" >> "$GITHUB_ENV"
            elif grep -Eq "\(404\)|Not Found" dist/cdn-head-error.log; then
              echo "${state_name}=false" >> "$GITHUB_ENV"
            else
              cat dist/cdn-head-error.log >&2
              exit 1
            fi
          }

          mkdir -p dist/existing-cdn
          reconcile_object "$descriptor" "dist/${descriptor}" \
            DESCRIPTOR_EXISTS dist/existing-cdn/descriptor.json
          reconcile_object "$artifact" "dist/${artifact}" \
            ARTIFACT_EXISTS dist/existing-cdn/artifact.zip

          aws s3 cp dist/marketplace.json "s3://${MARKETPLACE_BUCKET}/${stage}/marketplace.json" --content-type application/json --cache-control no-cache --only-show-errors
          aws s3 cp dist/marketplace.json.sig "s3://${MARKETPLACE_BUCKET}/${stage}/marketplace.json.sig" --content-type application/json --cache-control no-cache --only-show-errors
          aws s3 cp "dist/${descriptor}" "s3://${MARKETPLACE_BUCKET}/${stage}/${descriptor}" --content-type application/json --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          aws s3 cp "dist/${artifact}" "s3://${MARKETPLACE_BUCKET}/${stage}/${artifact}" --content-type application/zip --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          mkdir -p dist/staged/releases dist/staged/artifact
          aws s3 cp "s3://${MARKETPLACE_BUCKET}/${stage}/marketplace.json" dist/staged/marketplace.json --only-show-errors
          aws s3 cp "s3://${MARKETPLACE_BUCKET}/${stage}/marketplace.json.sig" dist/staged/marketplace.json.sig --only-show-errors
          aws s3 cp "s3://${MARKETPLACE_BUCKET}/${stage}/${descriptor}" dist/staged/releases/release.json --only-show-errors
          aws s3 cp "s3://${MARKETPLACE_BUCKET}/${stage}/${artifact}" dist/staged/artifact/release.zip --only-show-errors
          cmp dist/marketplace.json dist/staged/marketplace.json
          cmp dist/marketplace.json.sig dist/staged/marketplace.json.sig
          cmp "dist/${descriptor}" dist/staged/releases/release.json
          cmp "dist/${artifact}" dist/staged/artifact/release.zip

      - name: Create immutable GitHub Release
        if: env.RELEASE_EXISTS != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${SPECIALIST_ID}-v${VERSION}"
          asset="dist/specialists/${SPECIALIST_ID}/${VERSION}/${SPECIALIST_ID}-${VERSION}.zip"
          gh release create "$tag" "$asset" \
            --target "$GITHUB_SHA" \
            --title "${SPECIALIST_ID} ${VERSION}" \
            --notes "Immutable OpenScience Specialist release ${SPECIALIST_ID}@${VERSION}."

      - name: Update published branch with verified metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git show-ref --verify --quiet refs/remotes/origin/published; then
            git worktree add .worktree/published origin/published
          else
            git worktree add --detach .worktree/published
            git -C .worktree/published switch --orphan published
          fi
          mkdir -p ".worktree/published/releases/${SPECIALIST_ID}"
          cp dist/marketplace.json .worktree/published/marketplace.json
          cp dist/marketplace.json.sig .worktree/published/marketplace.json.sig
          cp "dist/releases/${SPECIALIST_ID}/${VERSION}.json" \
            ".worktree/published/releases/${SPECIALIST_ID}/${VERSION}.json"
          git -C .worktree/published add marketplace.json marketplace.json.sig releases
          if git -C .worktree/published diff --cached --quiet; then
            echo "Published metadata already matches the candidate"
          else
            git -C .worktree/published commit -m "feat(publishing): publish ${SPECIALIST_ID} ${VERSION}"
            git -C .worktree/published push \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:published
          fi

      - name: Promote immutable CDN objects and stable root
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MARKETPLACE_BUCKET: ${{ secrets.MARKETPLACE_BUCKET }}
          MARKETPLACE_CDN_DISTRIBUTION_ID: ${{ secrets.MARKETPLACE_CDN_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          prefix="${MARKETPLACE_CDN_PREFIX#/}"
          prefix="${prefix%/}"
          stage="${prefix}/staging/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          descriptor="releases/${SPECIALIST_ID}/${VERSION}.json"
          artifact="specialists/${SPECIALIST_ID}/${VERSION}/${SPECIALIST_ID}-${VERSION}.zip"
          if [[ "$DESCRIPTOR_EXISTS" != true ]]; then
            aws s3 cp "s3://${MARKETPLACE_BUCKET}/${stage}/${descriptor}" "s3://${MARKETPLACE_BUCKET}/${prefix}/${descriptor}" --copy-props none --content-type application/json --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          fi
          if [[ "$ARTIFACT_EXISTS" != true ]]; then
            aws s3 cp "s3://${MARKETPLACE_BUCKET}/${stage}/${artifact}" "s3://${MARKETPLACE_BUCKET}/${prefix}/${artifact}" --copy-props none --content-type application/zip --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          fi
          aws s3 cp dist/marketplace.json "s3://${MARKETPLACE_BUCKET}/${prefix}/marketplace.json" --content-type application/json --cache-control no-cache --only-show-errors
          aws s3 cp dist/marketplace.json.sig "s3://${MARKETPLACE_BUCKET}/${prefix}/marketplace.json.sig" --content-type application/json --cache-control no-cache --only-show-errors
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$MARKETPLACE_CDN_DISTRIBUTION_ID" \
            --paths "${MARKETPLACE_CDN_PREFIX}marketplace.json" \
              "${MARKETPLACE_CDN_PREFIX}marketplace.json.sig" \
            --query Invalidation.Id \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$MARKETPLACE_CDN_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Prove GitHub and CDN byte equality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETPLACE_CDN_BASE_URL: ${{ secrets.MARKETPLACE_CDN_BASE_URL }}
        run: |
          set -euo pipefail
          base="${MARKETPLACE_CDN_BASE_URL%/}${MARKETPLACE_CDN_PREFIX}"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/published/"
          descriptor="releases/${SPECIALIST_ID}/${VERSION}.json"
          artifact="specialists/${SPECIALIST_ID}/${VERSION}/${SPECIALIST_ID}-${VERSION}.zip"
          mkdir -p dist/final/github dist/final/cdn
          download() {
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 120 \
              "$1" -o "$2"
          }
          download "${raw}marketplace.json" dist/final/github/marketplace.json
          download "${raw}marketplace.json.sig" dist/final/github/marketplace.json.sig
          download "${raw}${descriptor}" dist/final/github/release.json
          gh release download "${SPECIALIST_ID}-v${VERSION}" --pattern "${SPECIALIST_ID}-${VERSION}.zip" --dir dist/final/github
          download "${base}marketplace.json" dist/final/cdn/marketplace.json
          download "${base}marketplace.json.sig" dist/final/cdn/marketplace.json.sig
          download "${base}${descriptor}" dist/final/cdn/release.json
          download "${base}${artifact}" dist/final/cdn/release.zip
          cmp dist/marketplace.json dist/final/github/marketplace.json
          cmp dist/marketplace.json dist/final/cdn/marketplace.json
          cmp dist/marketplace.json.sig dist/final/github/marketplace.json.sig
          cmp dist/marketplace.json.sig dist/final/cdn/marketplace.json.sig
          cmp "dist/${descriptor}" dist/final/github/release.json
          cmp "dist/${descriptor}" dist/final/cdn/release.json
          cmp "dist/${artifact}" "dist/final/github/${SPECIALIST_ID}-${VERSION}.zip"
          cmp "dist/${artifact}" dist/final/cdn/release.zip

      - name: Write public publication summary
        shell: bash
        env:
          MARKETPLACE_SIGNING_KEY_ID: ${{ vars.MARKETPLACE_SIGNING_KEY_ID }}
          MARKETPLACE_EXPECTED_KEY_FINGERPRINT: ${{ vars.MARKETPLACE_EXPECTED_KEY_FINGERPRINT }}
        run: |
          artifact_sha="$(node -p "JSON.parse(require('fs').readFileSync('dist/releases/${SPECIALIST_ID}/${VERSION}.json')).artifact.sha256")"
          revision="$(node -p "JSON.parse(require('fs').readFileSync('dist/marketplace.json')).revision")"
          {
            echo "## Published Specialist"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Tag: ${SPECIALIST_ID}-v${VERSION}"
            echo "- Marketplace revision: ${revision}"
            echo "- Artifact SHA-256: ${artifact_sha}"
            echo "- Signing key ID: ${MARKETPLACE_SIGNING_KEY_ID}"
            echo "- Public key fingerprint: ${MARKETPLACE_EXPECTED_KEY_FINGERPRINT}"
          } >> "$GITHUB_STEP_SUMMARY"
